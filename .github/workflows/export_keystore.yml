name: Export Keystore

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Package Keystore
        env:
          KEY_B64: ${{ secrets.ANTIGEM_DEBUG_KEYSTORE_BASE64 }}
          KEY_PWD: ${{ secrets.ANTIGEM_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p output
          printf '%s' "$KEY_B64" > output/keystore_base64.txt
          printf '%s' "$KEY_PWD" > output/keystore_password.txt
          printf '%s' "$KEY_B64" | base64 -d > output/antigem-debug.p12

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigem-keystore-backup
          path: output/
          retention-days: 1