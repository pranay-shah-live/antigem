name: Debug APK

# A debug build of this branch, with no keystore: installs next to the official app as ai.antidev.
on:
  workflow_dispatch:
  push:
    branches:
      - voice-shortcut

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # termux-am (termux/TermuxAm): am.apk is built from it. The other embedded folders are not submodules.
      - name: Fetch the termux-am submodule
        run: git submodule update --init --depth 1 termux-am

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (arm64)
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antigem-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
