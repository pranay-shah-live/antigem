name: Debug APK

# Debug build of this branch; the persistent keystore lets future ai.antidev builds update in place.
on:
  workflow_dispatch:
  push:
    branches:
      - voice-shortcut

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # termux-am (termux/TermuxAm): am.apk is built from it. The other embedded folders are not submodules.
      - name: Fetch the termux-am submodule
        run: git submodule update --init --depth 1 termux-am

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare persistent debug signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANTIGEM_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANTIGEM_DEBUG_KEYSTORE_PASSWORD }}
          EXPECTED_CERT_SHA256: 0A441900C91CA2F9E8B42E4B89AAE3C67294794A736EB6B2F48BCE66F682DF85
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANTIGEM_DEBUG_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANTIGEM_DEBUG_KEYSTORE_PASSWORD secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/antigem-debug.p12"
          ACTUAL_CERT_SHA256=$(keytool -list -v -keystore "$RUNNER_TEMP/antigem-debug.p12" -storepass "$KEYSTORE_PASSWORD" -alias antigem-debug | awk '/SHA256:/ {gsub(":", "", $2); print toupper($2); exit}')
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || { echo "Persistent debug key certificate mismatch"; exit 1; }

      - name: Build debug APK (arm64)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANTIGEM_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleDebug \
            -PdebugKeystore="$RUNNER_TEMP/antigem-debug.p12" \
            -PdebugStorePassword="$KEYSTORE_PASSWORD" \
            -PdebugKeyAlias=antigem-debug

      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: 0A441900C91CA2F9E8B42E4B89AAE3C67294794A736EB6B2F48BCE66F682DF85
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -print | sort -V | tail -1)
          test -n "$APK" && test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          APK_CERT_SHA256=$(awk '/Signer #1 certificate SHA-256 digest:/ {gsub(":", "", $NF); print toupper($NF); exit}' "$RUNNER_TEMP/apk-signature.txt")
          test "$APK_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || { echo "APK was not signed with the persistent debug key"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antigem-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
